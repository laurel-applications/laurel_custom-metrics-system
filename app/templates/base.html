{# The layout shared by every page of the UI. #}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Laurel Metrics{% endblock %}</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="{{ url_for('web.dashboard_list') }}">
          <span class="brand-mark">L</span>
          <span class="brand-name">Laurel Metrics</span>
        </a>
        <nav class="nav">
          <a href="{{ url_for('web.dashboard_list') }}">Dashboards</a>
          <a href="{{ url_for('web.metrics_overview') }}">Metrics</a>
        </nav>
      </div>
    </header>

    <main class="content">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <span>Laurel Metrics &middot; custom metrics, no auth, no build step</span>
    </footer>

    <script src="{{ url_for('static', filename='vendor/chart.umd.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/sortable.min.js') }}"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
